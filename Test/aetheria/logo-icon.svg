<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Ambient outer glow filter -->
    <filter id="brightloop-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep 3D drop shadow -->
    <filter id="ribbon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#050b14" flood-opacity="0.65" />
    </filter>

    <!-- Primary Electric Gradient (Cyan -> Sky -> Royal Blue) -->
    <linearGradient id="bl-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D61E7" />
    </linearGradient>

    <!-- Secondary Ribbon Gradient (Deep Cobalt -> Indigo -> Radiant Cyan) -->
    <linearGradient id="bl-secondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0B1E59" />
    </linearGradient>

    <!-- Internal Light Sheen Gradient -->
    <linearGradient id="bl-sheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Center Pulse Flare -->
    <radialGradient id="bl-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Underlayer -->
  <g filter="url(#brightloop-glow)" opacity="0.85">
    <!-- Continuous Mobius Infinity Ribbon Path -->
    <path d="M 32 32 C 18 32 10 40 10 50 C 10 60 18 68 32 68 C 42 68 49 61 56 50 C 63 39 70 32 80 32 C 90 32 96 40 96 50 C 96 60 88 68 76 68 C 66 68 59 61 52 50 C 45 39 39 32 32 32 Z" 
          stroke="url(#bl-primary)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Solid Infinity Loop Ribbon - Under Section -->
  <path d="M 32 32 C 18 32 10 40 10 50 C 10 60 18 68 32 68 C 42 68 49 61 56 50 C 63 39 70 32 80 32 C 90 32 96 40 96 50 C 96 60 88 68 76 68 C 66 68 59 61 52 50 C 45 39 39 32 32 32 Z" 
        stroke="url(#bl-secondary)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Overlapping Foreground Ribbon with 3D Depth (Crossing from bottom-left to top-right) -->
  <path d="M 28 65 C 38 65 46 58 53 49 C 61 38 69 32 80 32 C 91 32 96 40 96 50 C 96 60 88 68 76 68" 
        stroke="url(#bl-primary)" stroke-width="8.5" stroke-linecap="round" filter="url(#ribbon-shadow)" />

  <!-- High-Gloss Refraction Ridge (Inner Glass Highlight) -->
  <path d="M 29 34 C 19 34 13 41 13 50 C 13 58 19 65 29 65 C 38 65 45 59 52 49 C 59 39 67 34 77 34 C 87 34 93 41 93 50" 
        stroke="url(#bl-sheen)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Real-time Telemetry Pulse Dot at Möbius Node -->
  <circle cx="50" cy="50" r="8" fill="url(#bl-pulse)" opacity="0.75" />
  <circle cx="50" cy="50" r="2.8" fill="#FFFFFF" />
  <circle cx="78" cy="34" r="1.6" fill="#FFFFFF" opacity="0.85" />
</svg>
