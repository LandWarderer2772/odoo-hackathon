<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <!-- Ambient outer glow filter -->
    <filter id="bl-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ribbon Depth Shadow -->
    <filter id="bl-logo-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#050b14" flood-opacity="0.7" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="bl-logo-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D61E7" />
    </linearGradient>

    <linearGradient id="bl-logo-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0B1E59" />
    </linearGradient>

    <linearGradient id="bl-logo-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bl-text-loop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <radialGradient id="bl-logo-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Icon Mark Group (Scaled to 64x64 centered at x=10, y=8) -->
  <g transform="translate(8, 8) scale(0.64)">
    <!-- Outer Glow -->
    <g filter="url(#bl-logo-glow)" opacity="0.85">
      <path d="M 32 32 C 18 32 10 40 10 50 C 10 60 18 68 32 68 C 42 68 49 61 56 50 C 63 39 70 32 80 32 C 90 32 96 40 96 50 C 96 60 88 68 76 68 C 66 68 59 61 52 50 C 45 39 39 32 32 32 Z" 
            stroke="url(#bl-logo-grad1)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Base loop ribbon -->
    <path d="M 32 32 C 18 32 10 40 10 50 C 10 60 18 68 32 68 C 42 68 49 61 56 50 C 63 39 70 32 80 32 C 90 32 96 40 96 50 C 96 60 88 68 76 68 C 66 68 59 61 52 50 C 45 39 39 32 32 32 Z" 
          stroke="url(#bl-logo-grad2)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Foreground crossing ribbon -->
    <path d="M 28 65 C 38 65 46 58 53 49 C 61 38 69 32 80 32 C 91 32 96 40 96 50 C 96 60 88 68 76 68" 
          stroke="url(#bl-logo-grad1)" stroke-width="10" stroke-linecap="round" filter="url(#bl-logo-shadow)" />

    <!-- Gloss highlight -->
    <path d="M 29 34 C 19 34 13 41 13 50 C 13 58 19 65 29 65 C 38 65 45 59 52 49 C 59 39 67 34 77 34 C 87 34 93 41 93 50" 
          stroke="url(#bl-logo-sheen)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Pulse core -->
    <circle cx="50" cy="50" r="10" fill="url(#bl-logo-pulse)" opacity="0.8" />
    <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" />
    <circle cx="80" cy="34" r="2" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography: Stylized Brand Wordmark -->
  <g transform="translate(86, 0)">
    <!-- "Bright" in geometric pure white with tight tracking -->
    <text x="0" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
      Bright
    </text>

    <!-- "Loop" in radiant cyan gradient with stylized glow -->
    <text x="103" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.03em" fill="url(#bl-text-loop)">
      Loop
    </text>

    <!-- Subtle infinity accent mark on Loop -->
    <circle cx="178" cy="27" r="2.5" fill="#00F0FF" opacity="0.9" filter="url(#bl-logo-glow)" />

    <!-- Micro Subtitle: "SUBSCRIPTION OS" Pill Badge -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="138" height="15" rx="7.5" fill="#0c192d" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="9" cy="7.5" r="2.5" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="18" y="10.5" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.14em" fill="#94A3B8">
        ENTERPRISE OS
      </text>
    </g>
  </g>
</svg>
